# CD : build des images Docker sur main (prêt pour push vers un registry)
# Pour activer le push : ajouter les secrets (ex. GHCR, Docker Hub) et décommenter les steps.

name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: cinenoir-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: cinenoir-frontend:latest
          build-args: VITE_API_URL=http://localhost:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max

