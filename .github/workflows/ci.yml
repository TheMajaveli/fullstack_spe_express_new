name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cinenoir_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    - name: Install API dependencies
      working-directory: api
      run: npm ci

    - name: Generate Prisma Client
      working-directory: api
      run: npm run prisma:generate

    - name: Run API tests
      working-directory: api
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cinenoir_test?schema=public
        JWT_ACCESS_SECRET: test-access-secret
        JWT_REFRESH_SECRET: test-refresh-secret
        JWT_ACCESS_EXPIRES_IN: 15m
        JWT_REFRESH_EXPIRES_IN: 7d
      run: npm test

  build-api:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    - name: Install API dependencies
      working-directory: api
      run: npm ci

    - name: Generate Prisma Client
      working-directory: api
      run: npm run prisma:generate

    - name: Build API
      working-directory: api
      run: npm run build

  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm install

    - name: Build frontend
      working-directory: frontend
      run: npm run build
