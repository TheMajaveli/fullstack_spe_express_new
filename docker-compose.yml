# CineNoir - Stack complet (API + Frontend + MySQL)
# Usage: docker compose up -d
# Frontend: http://localhost:3000  |  API: http://localhost:4000

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: cinenoir_mysql
    environment:
      MYSQL_DATABASE: cinenoir
      MYSQL_USER: cinenoir
      MYSQL_PASSWORD: cinenoir
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cinenoir

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cinenoir_api
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: cinenoir
      DB_PASSWORD: cinenoir
      DB_NAME: cinenoir
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      RUN_MIGRATE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/uploads
      # Seed dans le conteneur : lit /movies.json (fichier à la racine du projet sur l’hôte)
      - ./movies.json:/movies.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cinenoir

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    container_name: cinenoir_frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cinenoir

volumes:
  mysql_data:
  api_uploads:

networks:
  cinenoir:
    driver: bridge
