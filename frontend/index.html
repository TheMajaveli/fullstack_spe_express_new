
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineNoir | Premium Cinema Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            accent: '#e11d48', // Cinematic Red
            cinema: {
              black: '#050505',
              card: '#0f0f0f',
              border: '#1f1f1f',
              text: '#f5f5f5'
            }
          },
          aspectRatio: {
            'poster': '2/3',
          },
          animation: {
            'fade-up': 'fadeUp 0.5s ease-out forwards',
            'blur-in': 'blurIn 0.8s ease-out forwards',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            blurIn: {
              '0%': { opacity: '0', filter: 'blur(20px)' },
              '100%': { opacity: '1', filter: 'blur(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #050505;
      --card-bg: #f9f9f9;
      --border-color: #e5e5e5;
    }
    .dark {
      --bg-color: #050505;
      --text-color: #ffffff;
      --card-bg: #0f0f0f;
      --border-color: #1f1f1f;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }
    .glass {
      background: rgba(5, 5, 5, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .light .glass {
      background: rgba(255, 255, 255, 0.75);
    }
    .film-grain::after {
      content: "";
      position: fixed;
      top: -100%; left: -100%; right: -100%; bottom: -100%;
      background-image: url("https://grainy-gradients.vercel.app/noise.svg");
      opacity: 0.04;
      pointer-events: none;
      z-index: 1000;
    }
    .poster-shadow {
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@^5.90.19",
    "@hookform/resolvers/": "https://esm.sh/@hookform/resolvers@^5.2.2/",
    "zustand": "https://esm.sh/zustand@^5.0.10",
    "zustand/": "https://esm.sh/zustand@^5.0.10/",
    "zod": "https://esm.sh/zod@^4.3.5",
    "react-hook-form": "https://esm.sh/react-hook-form@^7.71.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="film-grain">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
